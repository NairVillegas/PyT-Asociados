<svg width="240" height="240" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ptBlue" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#8FC1E8"/>
      <stop offset="45%" stop-color="#4A90C9"/>
      <stop offset="100%" stop-color="#1B4B78"/>
    </radialGradient>
    <path id="ptCurve" d="M 42,127 A 66,66 0 0,0 158,127"/>
  </defs>

  <!-- Anillo blanco exterior -->
  <circle cx="100" cy="100" r="97" fill="#FFFFFF"/>
  <!-- Anillo delgado azul -->
  <circle cx="100" cy="100" r="93" fill="none" stroke="#2C5F7C" stroke-width="1.6"/>
  <!-- Círculo principal con degradado -->
  <circle cx="100" cy="100" r="89" fill="url(#ptBlue)"/>

  <!-- P & T -->
  <text x="100" y="106" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="900"
        font-size="66" fill="#FFFFFF" letter-spacing="-2">P&amp;T</text>

  <!-- ASOCIADOS S.R.L. en arco -->
  <text font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="14" fill="#FFFFFF" letter-spacing="1">
    <textPath href="#ptCurve" startOffset="50%" text-anchor="middle">ASOCIADOS S.R.L.</textPath>
  </text>
</svg>
